<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#0F4C81">Vector Representation in 2D</text>
  
  <!-- Grid background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E9ECEF" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Coordinate system -->
  <line x1="100" y1="200" x2="700" y2="200" stroke="#2D3436" stroke-width="2"/>
  <line x1="400" y1="50" x2="400" y2="350" stroke="#2D3436" stroke-width="2"/>
  
  <!-- Axes labels -->
  <text x="710" y="215" font-size="14" font-weight="bold" fill="#0F4C81">X</text>
  <text x="385" y="35" font-size="14" font-weight="bold" fill="#0F4C81">Y</text>
  
  <!-- Tick marks and labels -->
  <line x1="500" y1="195" x2="500" y2="205" stroke="#2D3436" stroke-width="1"/>
  <text x="500" y="225" font-size="11" text-anchor="middle" fill="#2D3436">1</text>
  
  <line x1="600" y1="195" x2="600" y2="205" stroke="#2D3436" stroke-width="1"/>
  <text x="600" y="225" font-size="11" text-anchor="middle" fill="#2D3436">2</text>
  
  <line x1="395" y1="150" x2="405" y2="150" stroke="#2D3436" stroke-width="1"/>
  <text x="375" y="155" font-size="11" text-anchor="end" fill="#2D3436">1</text>
  
  <line x1="395" y1="100" x2="405" y2="100" stroke="#2D3436" stroke-width="1"/>
  <text x="375" y="105" font-size="11" text-anchor="end" fill="#2D3436">2</text>
  
  <!-- Origin marker -->
  <circle cx="400" cy="200" r="3" fill="#D62828"/>
  <text x="380" y="220" font-size="12" font-weight="bold" fill="#D62828">O(0,0)</text>
  
  <!-- Point A -->
  <circle cx="480" cy="160" r="4" fill="#1F7A8C"/>
  <text x="490" y="155" font-size="12" font-weight="bold" fill="#1F7A8C">A(2, 1)</text>
  
  <!-- Point B -->
  <circle cx="600" cy="100" r="4" fill="#1F7A8C"/>
  <text x="610" y="95" font-size="12" font-weight="bold" fill="#1F7A8C">B(5, 2.5)</text>
  
  <!-- Vector AB (arrow from A to B) -->
  <line x1="480" y1="160" x2="600" y2="100" stroke="#FFB000" stroke-width="3"/>
  <!-- Arrowhead -->
  <polygon points="600,100 590,105 595,95" fill="#FFB000"/>
  
  <!-- Vector label -->
  <text x="550" y="125" font-size="13" font-weight="bold" fill="#FFB000">Vector AB</text>
  
  <!-- Components visualization -->
  <line x1="480" y1="160" x2="600" y2="160" stroke="#E76F51" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="600" y1="160" x2="600" y2="100" stroke="#E76F51" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Component labels -->
  <text x="540" y="180" font-size="11" fill="#E76F51">Δx = 3</text>
  <text x="620" y="130" font-size="11" fill="#E76F51">Δy = 1.5</text>
  
  <!-- Legend -->
  <g>
    <rect x="50" y="320" width="250" height="60" fill="#F8F9FA" stroke="#0F4C81" stroke-width="1"/>
    <text x="60" y="340" font-size="11" font-weight="bold" fill="#0F4C81">Vector Properties:</text>
    <text x="60" y="360" font-size="10" fill="#2D3436">• Magnitude: |AB| = √(3² + 1.5²) ≈ 3.35</text>
    <text x="60" y="375" font-size="10" fill="#2D3436">• Direction: θ = arctan(1.5/3) ≈ 26.6°</text>
  </g>
</svg>