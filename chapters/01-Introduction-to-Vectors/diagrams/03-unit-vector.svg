<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#0F4C81">Unit Vector: Direction with Magnitude 1</text>
  
  <!-- Left: Original Vector -->
  <g>
    <text x="200" y="70" font-size="14" font-weight="bold" fill="#1F7A8C">Original Vector v</text>
    
    <!-- Grid -->
    <defs>
      <pattern id="grid3" width="25" height="25" patternUnits="userSpaceOnUse">
        <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E9ECEF" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect x="50" y="100" width="300" height="250" fill="url(#grid3)" opacity="0.2"/>
    
    <!-- Axes -->
    <line x1="50" y1="300" x2="350" y2="300" stroke="#2D3436" stroke-width="2"/>
    <line x1="50" y1="100" x2="50" y2="300" stroke="#2D3436" stroke-width="2"/>
    
    <!-- Origin -->
    <circle cx="50" cy="300" r="3" fill="#D62828"/>
    <text x="25" y="320" font-size="11" fill="#D62828">O</text>
    
    <!-- Vector v = (4, 3) -->
    <line x1="50" y1="300" x2="200" y2="175" stroke="#FFB000" stroke-width="4"/>
    <polygon points="200,175 193,181 185,172" fill="#FFB000"/>
    
    <!-- Point label -->
    <circle cx="200" cy="175" r="4" fill="#2A9D8F"/>
    <text x="210" y="170" font-size="12" font-weight="bold" fill="#2A9D8F">v(4,3)</text>
    
    <!-- Length annotation -->
    <text x="130" y="150" font-size="11" fill="#FFB000" font-weight="bold">|v| = 5</text>
    
    <!-- Info box -->
    <rect x="30" y="330" width="270" height="50" fill="#FFF3E0" stroke="#E76F51" stroke-width="1" rx="3"/>
    <text x="45" y="350" font-size="11" font-weight="bold" fill="#E76F51">Vector v = 4î + 3ĵ</text>
    <text x="45" y="370" font-size="10" fill="#2D3436">Magnitude: |v| = √(16 + 9) = 5</text>
  </g>
  
  <!-- Arrow and transformation -->
  <g>
    <text x="400" y="210" font-size="24" font-weight="bold" fill="#0F4C81" text-anchor="middle">Divide by</text>
    <text x="400" y="235" font-size="20" fill="#0F4C81" text-anchor="middle" font-weight="bold">|v| = 5</text>
    <path d="M 400 260 L 400 290" stroke="#0F4C81" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Right: Unit Vector -->
  <g>
    <text x="600" y="70" font-size="14" font-weight="bold" fill="#1F7A8C">Unit Vector û</text>
    
    <!-- Grid -->
    <rect x="500" y="100" width="300" height="250" fill="url(#grid3)" opacity="0.2"/>
    
    <!-- Axes -->
    <line x1="500" y1="300" x2="800" y2="300" stroke="#2D3436" stroke-width="2"/>
    <line x1="500" y1="100" x2="500" y2="300" stroke="#2D3436" stroke-width="2"/>
    
    <!-- Origin -->
    <circle cx="500" cy="300" r="3" fill="#D62828"/>
    <text x="475" y="320" font-size="11" fill="#D62828">O</text>
    
    <!-- Unit circle reference -->
    <circle cx="500" cy="300" r="80" fill="none" stroke="#2A9D8F" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    
    <!-- Unit vector û = (0.8, 0.6) -->
    <line x1="500" y1="300" x2="564" cy="252" stroke="#2A9D8F" stroke-width="4"/>
    <polygon points="564,252 559,259 552,249" fill="#2A9D8F"/>
    
    <!-- Point label -->
    <circle cx="564" cy="252" r="4" fill="#2A9D8F"/>
    <text x="570" y="247" font-size="12" font-weight="bold" fill="#2A9D8F">û(0.8,0.6)</text>
    
    <!-- Length annotation -->
    <text x="535" y="225" font-size="11" fill="#2A9D8F" font-weight="bold">|û| = 1</text>
    
    <!-- Info box -->
    <rect x="480" y="330" width="280" height="50" fill="#E8F5E9" stroke="#2A9D8F" stroke-width="1" rx="3"/>
    <text x="495" y="350" font-size="11" font-weight="bold" fill="#2A9D8F">Unit vector û = 0.8î + 0.6ĵ</text>
    <text x="495" y="370" font-size="10" fill="#2D3436">Magnitude: |û| = 1 (exactly)</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#0F4C81"/>
    </marker>
  </defs>
</svg>