<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#0F4C81">Magnitude Calculation: Pythagorean Theorem</text>
  
  <!-- Left panel: 2D example -->
  <g>
    <text x="200" y="80" font-size="16" font-weight="bold" fill="#1F7A8C">2D Vector</text>
    
    <!-- Grid -->
    <defs>
      <pattern id="grid2d" width="30" height="30" patternUnits="userSpaceOnUse">
        <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E9ECEF" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect x="50" y="100" width="300" height="300" fill="url(#grid2d)" opacity="0.2"/>
    
    <!-- Axes -->
    <line x1="50" y1="350" x2="350" y2="350" stroke="#2D3436" stroke-width="2"/>
    <line x1="50" y1="100" x2="50" y2="350" stroke="#2D3436" stroke-width="2"/>
    
    <!-- Origin -->
    <circle cx="50" cy="350" r="3" fill="#D62828"/>
    <text x="30" y="370" font-size="11" fill="#D62828">O</text>
    
    <!-- Point P -->
    <circle cx="230" cy="170" r="4" fill="#2A9D8F"/>
    <text x="240" y="165" font-size="11" font-weight="bold" fill="#2A9D8F">P(6, 8)</text>
    
    <!-- Vector OP -->
    <line x1="50" y1="350" x2="230" y2="170" stroke="#FFB000" stroke-width="3"/>
    <polygon points="230,170 224,178 218,168" fill="#FFB000"/>
    
    <!-- Components -->
    <line x1="50" y1="350" x2="230" y2="350" stroke="#E76F51" stroke-width="2"/>
    <line x1="230" y1="350" x2="230" y2="170" stroke="#E76F51" stroke-width="2"/>
    
    <text x="140" y="370" font-size="12" fill="#E76F51" font-weight="bold">x = 6</text>
    <text x="250" y="260" font-size="12" fill="#E76F51" font-weight="bold">y = 8</text>
    
    <!-- Right angle marker -->
    <rect x="230" y="330" width="20" height="20" fill="none" stroke="#E76F51" stroke-width="1"/>
    
    <!-- Formula -->
    <g>
      <rect x="30" y="410" width="240" height="70" fill="#E8F5E9" stroke="#2A9D8F" stroke-width="2" rx="5"/>
      <text x="50" y="430" font-size="13" font-weight="bold" fill="#2A9D8F">Formula:</text>
      <text x="50" y="450" font-size="12" fill="#2D3436">|v| = √(x² + y²)</text>
      <text x="50" y="470" font-size="12" fill="#2D3436">|v| = √(6² + 8²) = √(36 + 64)</text>
    </g>
  </g>
  
  <!-- Right panel: 3D example -->
  <g>
    <text x="600" y="80" font-size="16" font-weight="bold" fill="#1F7A8C">3D Vector</text>
    
    <!-- 3D axes perspective drawing -->
    <!-- X-axis -->
    <line x1="500" y1="300" x2="650" y2="300" stroke="#2D3436" stroke-width="2"/>
    <text x="670" y="305" font-size="12" font-weight="bold" fill="#0F4C81">X</text>
    
    <!-- Y-axis -->
    <line x1="500" y1="300" x2="480" y2="180" stroke="#2D3436" stroke-width="2"/>
    <text x="460" y="170" font-size="12" font-weight="bold" fill="#0F4C81">Y</text>
    
    <!-- Z-axis -->
    <line x1="500" y1="300" x2="550" y2="360" stroke="#2D3436" stroke-width="2"/>
    <text x="570" y="370" font-size="12" font-weight="bold" fill="#0F4C81">Z</text>
    
    <!-- Point P' -->
    <circle cx="620" cy="260" r="4" fill="#2A9D8F"/>
    <text x="630" y="255" font-size="11" font-weight="bold" fill="#2A9D8F">P(3, 4, 5)</text>
    
    <!-- Vector to P' -->
    <line x1="500" y1="300" x2="620" y2="260" stroke="#FFB000" stroke-width="3"/>
    <polygon points="620,260 614,265 612,253" fill="#FFB000"/>
    
    <!-- Projection lines -->
    <line x1="620" y1="260" x2="650" y2="300" stroke="#E76F51" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="650" y1="300" x2="500" y2="300" stroke="#E76F51" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Formula -->
    <g>
      <rect x="480" y="410" width="280" height="80" fill="#E8F5E9" stroke="#2A9D8F" stroke-width="2" rx="5"/>
      <text x="500" y="430" font-size="13" font-weight="bold" fill="#2A9D8F">Formula:</text>
      <text x="500" y="450" font-size="12" fill="#2D3436">|v| = √(x² + y² + z²)</text>
      <text x="500" y="470" font-size="12" fill="#2D3436">|v| = √(3² + 4² + 5²)</text>
      <text x="500" y="485" font-size="12" fill="#2D3436">|v| = √50 = 5√2 ≈ 7.07</text>
    </g>
  </g>
</svg>